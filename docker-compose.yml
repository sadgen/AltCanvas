services:
  altcanvas:
    build: .
    image: ghcr.io/sadgen/altcanvas:latest
    container_name: altcanvas
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "${PORT:-8088}:8088"
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      - NODE_ENV=${NODE_ENV:-production}
      - ALTERO_API=${ALTERO_API:-http://localhost:8000}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-altcanvas}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-http://localhost:8088}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - REQUIRE_ORIGIN=${REQUIRE_ORIGIN:-false}
      - ALLOW_PRIVATE_HOSTS=${ALLOW_PRIVATE_HOSTS:-false}
      - ALLOW_DYNAMIC_ALTERO=${ALLOW_DYNAMIC_ALTERO:-false}
      - ALLOW_DIRECT_AUTH=${ALLOW_DIRECT_AUTH:-false}
      - ALLOW_INSECURE_OAUTH=${ALLOW_INSECURE_OAUTH:-false}
      - MAX_API_BODY_BYTES=${MAX_API_BODY_BYTES:-1048576}
      - MAX_CANVAS_BODY_BYTES=${MAX_CANVAS_BODY_BYTES:-524288}
      - CANVAS_DB_PATH=/app/data/altcanvas-canvas.sqlite
      - UPSTREAM_TIMEOUT_MS=${UPSTREAM_TIMEOUT_MS:-15000}
      - UPSTREAM_STREAM_IDLE_TIMEOUT_MS=${UPSTREAM_STREAM_IDLE_TIMEOUT_MS:-30000}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-60000}
      - AI_MAX_RESPONSE_BYTES=${AI_MAX_RESPONSE_BYTES:-524288}
      - ALLOW_PRIVATE_AI_HOSTS=${ALLOW_PRIVATE_AI_HOSTS:-false}
      - ALLOW_INSECURE_AI=${ALLOW_INSECURE_AI:-false}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - DATA_DIR=/app/data
    volumes:
      - ${ALTCANVAS_DATA_DIR:-./data}:/app/data
