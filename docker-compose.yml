services:
  altcanvas:
    build: .
    image: ghcr.io/sadgen/altcanvas:latest
    container_name: altcanvas
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "${PORT:-8088}:8088"
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      - NODE_ENV=${NODE_ENV:-production}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-http://localhost:8088}
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - REQUIRE_ORIGIN=${REQUIRE_ORIGIN:-false}
      - MAX_CANVAS_BODY_BYTES=${MAX_CANVAS_BODY_BYTES:-524288}
      - CANVAS_DB_PATH=/app/data/altcanvas-canvas.sqlite
      - UPSTREAM_STREAM_IDLE_TIMEOUT_MS=${UPSTREAM_STREAM_IDLE_TIMEOUT_MS:-30000}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-60000}
      - AI_MAX_RESPONSE_BYTES=${AI_MAX_RESPONSE_BYTES:-524288}
      - ALLOW_PRIVATE_AI_HOSTS=${ALLOW_PRIVATE_AI_HOSTS:-false}
      - ALLOW_INSECURE_AI=${ALLOW_INSECURE_AI:-false}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - DATA_DIR=/app/data
      # Native research library roots. Server-side absolute paths only;
      # NATIVE_LIBRARY_ROOTS must reference directories mounted below.
      - NATIVE_LIBRARY_ROOTS=${NATIVE_LIBRARY_ROOTS:-/app/library|研究文库}
    volumes:
      - ${ALTCANVAS_DATA_DIR:-./data}:/app/data
      # Read-write mount of the host research library scanned by AltCanvas.
      - ${ALTCANVAS_LIBRARY_DIR:-./library}:/app/library
